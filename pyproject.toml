[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-drl-portfolio-allocation"
version = "0.1.0"
description = "Ensemble DRL for portfolio allocation (RQ1 seed-disagreement, RQ2 reward-diversity, RQ3 algorithm-diversity)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.17.3",
    "pandas>=1.1.5",
    "matplotlib",
    "scipy",
    "scikit-learn>=0.21",
    "gymnasium",
    "torch",
    "tensorboard",
    "stable-baselines3[extra]>=2.0.0a5",
    "pyfolio-reloaded>=0.9",
    "yfinance>=0.2",
    "pyportfolioopt>=1",
]

[tool.setuptools]
packages = [
    "rl_portfolio",
    "rl_portfolio.envs",
    "rl_portfolio.agents",
    "rl_portfolio.utils",
    "pipelines",
    "pipelines.data",
    "pipelines.baselines",
    "pipelines.rq1",
    "pipelines.rq2",
    "pipelines.rq3",
]

[tool.setuptools.package-dir]
rl_portfolio = "src/rl_portfolio"
pipelines = "pipelines"
